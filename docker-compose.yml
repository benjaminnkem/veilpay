services:
  postgres:
    image: postgres:16-alpine
    container_name: veilpay-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: veilpay
      POSTGRES_PASSWORD: veilpay
      POSTGRES_DB: veilpay
    volumes:
      - veilpay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veilpay -d veilpay']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  veilpay_pg_data:
